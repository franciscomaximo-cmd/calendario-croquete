<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Croquetada: quando?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='14' rx='7' fill='%23d9822b' stroke='%233b2412' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo"><div class="in">
  <div>
    <h1>Quando é a próxima croquetada?</h1>
    <p class="lead">Marca os dias em que estás livre. O dia com mais gente vai para o pedido do dia, e quem faltar paga os croquetes.</p>
  </div>
  <svg class="prato" viewBox="0 0 300 200" role="img" aria-label="Prato com três croquetes e um palito com bandeira">
    <defs>
      <linearGradient id="crosta" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f2b252"/><stop offset=".45" stop-color="#d9822b"/><stop offset="1" stop-color="#94501a"/>
      </linearGradient>
      <pattern id="migalhas" width="14" height="12" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.6" fill="#7a3f12" opacity=".55"/><circle cx="10" cy="8" r="1.3" fill="#fbd08a" opacity=".7"/>
        <circle cx="7" cy="2" r=".9" fill="#fbd08a" opacity=".6"/><circle cx="12" cy="11" r="1" fill="#7a3f12" opacity=".45"/>
      </pattern>
      <g id="croq">
        <rect x="0" y="0" width="124" height="48" rx="24" fill="url(#crosta)"/>
        <rect x="0" y="0" width="124" height="48" rx="24" fill="url(#migalhas)"/>
        <path d="M22 9 H100" stroke="#fde3b0" stroke-width="4" stroke-linecap="round" opacity=".55"/>
        <rect x="0" y="0" width="124" height="48" rx="24" fill="none" stroke="#3b2412" stroke-width="3"/>
      </g>
    </defs>
    <!-- prato -->
    <ellipse cx="150" cy="172" rx="138" ry="22" fill="#3b2412" opacity=".25"/>
    <ellipse cx="150" cy="164" rx="138" ry="26" fill="#fffaf0" stroke="#3b2412" stroke-width="3"/>
    <ellipse cx="150" cy="162" rx="104" ry="16" fill="none" stroke="#e8d9bd" stroke-width="3"/>
    <!-- mostarda -->
    <path d="M232 150 q14 -14 30 -4 q8 8 -4 14 q-16 6 -26 -10z" fill="#e0a800" stroke="#3b2412" stroke-width="3"/>
    <!-- croquetes -->
    <use href="#croq" x="36" y="112"/>
    <use href="#croq" x="140" y="114"/>
    <use href="#croq" x="86" y="70" transform="rotate(-6 148 94)"/>
    <!-- palito com bandeira -->
    <g class="bandeira">
      <line x1="150" y1="88" x2="126" y2="22" stroke="#c9a46a" stroke-width="4" stroke-linecap="round"/>
      <line x1="150" y1="88" x2="126" y2="22" stroke="#3b2412" stroke-width="1" opacity=".4"/>
      <path d="M127 24 L170 14 L168 40 L134 46 Z" fill="#fffaf0" stroke="#3b2412" stroke-width="3" stroke-linejoin="round"/>
      <path d="M140 28 l6 10 l14 -18" fill="none" stroke="#d9822b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>
</div></header>

<main class="band"><div class="wrap">
  <div id="warn"></div>
  <div class="me">
    <label for="nick">O teu nome</label>
    <input type="text" id="nick" maxlength="24" placeholder="ex.: Francisco" autocomplete="nickname">
    <span class="alt">
      <label for="claim">Já marcaste noutro dispositivo?</label>
      <select id="claim"><option value="">Escolhe o teu nome</option></select>
    </span>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--yes)"></i><b>Livre</b> bem frito</span>
    <span><i class="dot" style="background:var(--maybe)"></i><b>Talvez</b> meio cru</span>
    <span><i class="dot" style="background:var(--no)"></i><b>Ocupado</b> queimado</span>
    <label class="vista">Mostrar
      <select id="vista"><option value="all">Semana toda</option><option value="fds">Só fins de semana</option></select>
    </label>
  </div>
  <div id="best" class="best empty"><div class="big">—</div><div class="t">A aquecer o óleo…</div><div class="s"></div></div>
  <section class="weeks" id="weeks" aria-label="Semanas"></section>
  <button class="more" id="more" type="button">Mais semanas</button>
  <p class="status" id="status">A ligar…</p>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
