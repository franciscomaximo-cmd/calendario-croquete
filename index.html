<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Croquetada: quando?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='14' rx='7' fill='%23f2c230' stroke='%231d1b17' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo"><div class="wrap">
  <h1>Quando é a próxima croquetada?</h1>
</div></header>

<main class="band"><div class="wrap">
  <section class="ola" id="ola" aria-labelledby="olat" hidden>
    <h2 id="olat">Quem és tu?</h2>
    <div class="nomes" id="olanomes"></div>
    <button class="linkbtn" id="novo" type="button">Sou novo no grupo</button>
  </section>
  <div id="warn"></div>
  <div class="me">
    <label class="campo">O teu nome
      <input type="text" id="nick" maxlength="24" placeholder="O teu nome" autocomplete="nickname" aria-describedby="nickdica">
    </label>
    <select id="vista" aria-label="Mostrar"><option value="all">Semana toda</option><option value="fds">Só fins de semana</option></select>
    <p class="dica-erro" id="nickdica" hidden></p>
    <p class="dup" id="nickdup" role="status" hidden></p>
    <details class="alt">
      <summary>Já marcaste noutro dispositivo?</summary>
      <select id="claim" aria-label="Escolhe o teu nome"><option value="">Escolhe o teu nome</option></select>
    </details>
  </div>
  <div id="best" class="best empty"><h2 class="t">A carregar…</h2></div>
  <p class="status" id="status" role="status">A ligar…</p>
  <section class="bloco" id="bloco" aria-label="Semanas">
    <div class="lombada" aria-hidden="true"></div>
    <div class="folhas-caixa" id="caixa">
      <div class="weeks folhas" id="weeks"></div>
      <div class="aba" aria-hidden="true"><div class="aba-clip"><div class="aba-papel"><div class="aba-curva"></div></div></div></div>
      <div class="zonas" id="zonas" aria-hidden="true"><i data-z="t"></i><i data-z="b"></i><i data-z="l"></i><i data-z="r"></i><i data-z="tl"></i><i data-z="tr"></i><i data-z="bl"></i><i data-z="br"></i></div>
    </div>
    <nav class="barra" id="barra" aria-label="Mudar de semana">
      <button type="button" class="seta" id="ant" aria-label="Semana anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="pontos" id="pontos" aria-hidden="true"></div>
      <span class="qual" id="qual" aria-live="polite"></span>
      <button class="more" id="more" type="button" hidden>Ver mais semanas</button>
      <button type="button" class="seta" id="seg" aria-label="Semana seguinte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </nav>
  </section>
</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="folhas.js"></script>
<script src="app.js"></script>
</body>
</html>
