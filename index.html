<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Croquetada: quando?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='26' height='14' rx='7' fill='%23f2c230' stroke='%231d1b17' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo"><div class="wrap">
  <h1>Quando é a próxima croquetada?</h1>
</div></header>

<main class="band"><div class="wrap">
  <div id="warn"></div>
  <div class="me">
    <label class="campo">O teu nome
      <input type="text" id="nick" maxlength="24" placeholder="O teu nome" autocomplete="nickname" aria-describedby="nickdica">
      <span class="dica-erro" id="nickdica" hidden>Escreve primeiro o teu nome, para os outros saberem quem marcou.</span>
    </label>
    <select id="vista" aria-label="Mostrar"><option value="all">Semana toda</option><option value="fds">Só fins de semana</option></select>
    <details class="alt">
      <summary>Já marcaste noutro dispositivo?</summary>
      <select id="claim" aria-label="Escolhe o teu nome"><option value="">Escolhe o teu nome</option></select>
    </details>
  </div>
  <div id="best" class="best empty"><h2 class="t">A carregar…</h2></div>
  <section class="weeks" id="weeks" aria-label="Semanas"></section>
  <button class="more" id="more" type="button">Mostrar mais 4 semanas</button>
  <p class="status" id="status">A ligar…</p>
</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
